name: web-kwu-dev

# Local dev infra only — run the app on the host with `bun dev`.
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: web-kwu-dev-postgres
    environment:
      POSTGRES_DB: web-kwu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - web-kwu-dev_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: web-kwu-dev-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - web-kwu-dev_rustfs_data:/data
    restart: unless-stopped

volumes:
  web-kwu-dev_postgres_data:
  web-kwu-dev_rustfs_data:
